name: Build Node 26 ARM64 musl (review candidate only)

on:
  push:
    paths:
      - build-inputs/source.sha256
      - .github/workflows/build-node-musl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout build-only repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check pinned source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "263f639ecfa7a17b49438d76cdbf9aff73179e3c7cb789da69b900718427fa2e  node-v26.13.0.tar.xz" > expected-source.sha256
          actual="$(tr -d '[:space:]' < build-inputs/source.sha256)"
          test "$actual" = "263f639ecfa7a17b49438d76cdbf9aff73179e3c7cb789da69b900718427fa2e" || { echo 'Pinned SHA mismatch'; exit 1; }

      - name: Build inside native ARM64 Alpine musl container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network bridge \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            --memory 12g --cpus 4 \
            alpine:3.23 sh -eu -c '
              apk add --no-cache ca-certificates curl xz tar coreutils python3 make gcc g++ linux-headers binutils file pkgconf rust cargo git
              test "$(uname -m)" = "aarch64"
              curl --fail --location --retry 3 --proto "=https" --tlsv1.2 \
                https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.xz -o node-v26.13.0.tar.xz
              sha256sum -c expected-source.sha256
              tar -xf node-v26.13.0.tar.xz
              cd node-v26.13.0
              ./configure --prefix=/work/node-stage
              make -j2
              make install
              test -x /work/node-stage/bin/node
              mkdir -p /work/review
              cp /work/node-stage/bin/node /work/review/node
              cd /work
              sha256sum review/node > review/SHA256SUMS
              file review/node > review/file.txt
              readelf -h review/node > review/elf-header.txt
              readelf -l review/node > review/program-headers.txt
              readelf -d review/node > review/dynamic.txt
              readelf --version-info review/node > review/symbol-versions.txt
              ldd review/node > review/dependencies.txt 2>&1 || true
              uname -a > review/build-kernel.txt
              echo "REVIEW ONLY: no approval to execute on AW1000" > review/NOT-PRODUCTION.txt
            '

      - name: Upload ABI review artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-v26.13.0-aarch64-musl-REVIEW-ONLY
          path: review/
          if-no-files-found: error
          retention-days: 7
